[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "woodland-spec"
version = "0.1.0"
description = "CWH woodland growing medium specification builders for a constructed urban woodland tender document."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "UBC FRESH Lab"}]
keywords = [
    "coastal-western-hemlock",
    "growing-medium",
    "landscape-specification",
    "urban-woodland",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "python-docx>=1.1,<2",
    "rich>=13",
    "typer>=0.9",
]

[project.urls]
Homepage = "https://github.com/UBC-FRESH/urban-woodland-growing-medium"
Repository = "https://github.com/UBC-FRESH/urban-woodland-growing-medium"
Issues = "https://github.com/UBC-FRESH/urban-woodland-growing-medium/issues"
Changelog = "https://github.com/UBC-FRESH/urban-woodland-growing-medium/blob/main/CHANGE_LOG.md"

[project.optional-dependencies]
docs = [
    "sphinx>=7",
    "sphinx-rtd-theme>=2",
]
dev = [
    "build>=1.2",
    "pytest>=8",
    "ruff>=0.5",
    "sphinx>=7",
    "sphinx-rtd-theme>=2",
    "twine>=5",
]
quality = [
    "ruff>=0.5",
]
release = [
    "build>=1.2",
    "twine>=5",
]
test = [
    "pytest>=8",
]

[project.scripts]
woodland-spec = "woodland_spec.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tmp"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
# Specification prose lives in long string literals in the builder modules.
"src/woodland_spec/build_spec.py" = ["E501"]
"src/woodland_spec/add_properties.py" = ["E501"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
